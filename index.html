<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0c10">
  <meta name="description" content="画像を選ぶと、ピクセルを明るさや色で並び替えて変換します。画像は端末の中だけで処理します。">
  <title>pixel-sort — 画像のピクセルを並び替える</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="pixel-sort">
  <meta property="og:title" content="pixel-sort — 画像のピクセルを並び替える">
  <meta property="og:description" content="画像を選ぶと、ピクセルを明るさや色で並び替えて変換します。画像は端末の中だけで処理します。">
  <meta property="og:url" content="https://t-of.github.io/pixel-sort/">
  <meta property="og:image" content="https://t-of.github.io/pixel-sort/icons/og.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:locale" content="ja_JP">
  <meta name="twitter:card" content="summary_large_image">

  <!-- apple-mobile-web-app-status-bar-style は付けない（black-translucent だと iOS 26 で上部が隠れる） -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="pixel-sort">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="icon" type="image/png" sizes="32x32" href="./icons/favicon-32.png">
  <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">

  <link rel="stylesheet" href="./webapp-kit/webapp-kit.css">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="app">
    <header class="bar">
      <h1 class="bar__title">pixel-sort</h1>
      <div class="bar__actions">
        <button class="pill" data-wak="install" hidden>アプリにする</button>
        <button class="pill" data-wak="share">共有</button>
      </div>
    </header>

    <section class="stage" id="stage">
      <div class="mode" id="modeRow">
        <label><input type="radio" name="mode" value="1" id="mode1" checked> 1 枚</label>
        <label><input type="radio" name="mode" value="2" id="mode2"> 2 枚</label>
      </div>

      <div class="drop" id="dropMat">
        <p>画像を選ぶ、またはここにドラッグ＆ドロップ</p>
        <input type="file" accept="image/*" id="fileMat">
      </div>
      <div class="drop" id="dropRef" hidden>
        <p>お手本の画像を選ぶ、またはここにドラッグ＆ドロップ</p>
        <input type="file" accept="image/*" id="fileRef">
      </div>

      <div class="controls" id="controls" hidden>
        <label>
          並び替え
          <select id="rule">
            <option value="sum">明るさ（R+G+B）</option>
            <option value="r">R</option>
            <option value="g">G</option>
            <option value="b">B</option>
            <option value="hue">色相（Hue）</option>
          </select>
        </label>
        <label id="orderLabel">
          <select id="order">
            <option value="asc">昇順</option>
            <option value="desc">降順</option>
          </select>
        </label>
        <button class="pill" id="save">PNG を保存</button>
      </div>

      <div class="canvases" id="canvases" hidden>
        <figure>
          <figcaption>素材</figcaption>
          <canvas id="src"></canvas>
        </figure>
        <figure id="refFigure" hidden>
          <figcaption>お手本</figcaption>
          <canvas id="ref"></canvas>
        </figure>
        <figure>
          <figcaption>結果</figcaption>
          <canvas id="out"></canvas>
          <button class="pill" id="play">再生</button>
        </figure>
        <canvas class="anim-stage" id="animStage"></canvas>
      </div>
    </section>

    <footer class="credit">
      <a href="/">T.OF...</a> のアプリ・<a href="https://t-of.github.io/contact/">問い合わせ</a>
    </footer>
  </main>

  <script src="./webapp-kit/webapp-kit.js"></script>
  <script src="./main.js"></script>
</body>
</html>
